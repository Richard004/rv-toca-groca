<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Toca Groca"/>
  <meta name="theme-color" content="#F3EBD9"/>
  <title>Toca Groca — Náš rodinný svět</title>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="./icons/app-icon.svg"/>
</head>
<body>
  <div id="app">
    <div id="splash" class="screen active">
      <div>
        <h1 class="logo-title">Toca Groca</h1>
        <p class="logo-sub">Náš rodinný svět</p>
        <div class="splash-row" id="splash-chars"></div>
        <p class="splash-tag">Hraj, zařizuj a vymýšlej příběhy s celou rodinou.</p>
        <button class="btn-play" id="btn-play" type="button">Pojď hrát</button>
        <div>
          <button class="btn-quiet" id="btn-new-world" type="button">Nový svět</button>
          <button class="btn-quiet" id="btn-updates-splash" type="button">Co je nového</button>
        </div>
        <p class="splash-credit">Udělal Táta Richard pro Klárku, Anetku, Taníčku a Ríšu</p>
      </div>
    </div>

    <aside class="drawer" id="world-start-drawer">
      <div class="drawer-header">
        <h3>Jak chceš začít?</h3>
        <button class="drawer-close" type="button">✕</button>
      </div>
      <div class="world-start-grid">
        <button type="button" class="world-start-card world-start-card--featured" data-world="furnished">
          <span class="world-start-title">Krásně zařízený dům</span>
          <span class="world-start-desc">Rodina, nábytek, zahrada i chalupa — dárek od Táty.</span>
        </button>
        <button type="button" class="world-start-card" data-world="empty">
          <span class="world-start-title">Prázdný dům</span>
          <span class="world-start-desc">Jen prázdné místnosti. Všechno přidáš ty.</span>
        </button>
      </div>
    </aside>

    <div id="game" class="screen">
      <main class="game-world" id="game-world">
        <div class="world-scroll" id="world-scroll">
          <div class="rooms-strip" id="rooms-strip"></div>
        </div>
      </main>

      <div class="game-overlay">
        <button type="button" class="overlay-pill" id="btn-room-picker">
          <span id="overlay-room-name">Obývák</span>
        </button>
        <button type="button" class="overlay-round map" id="btn-world-map" aria-label="Mapa">◎</button>
        <button type="button" class="overlay-round home" id="btn-home" aria-label="Domů">⌂</button>
        <div class="overlay-dots" id="room-dots"></div>
      </div>

      <button type="button" class="tray-scrim" id="tray-scrim" hidden aria-label="Zavřít"></button>

      <div class="focus-dock" id="focus-dock" hidden>
        <div class="focus-who">
          <strong id="focus-name">—</strong>
          <button type="button" class="focus-away" id="focus-away">Pryč</button>
        </div>
        <div class="focus-faces" id="emotion-buttons"></div>
      </div>

      <aside class="play-tray" id="play-tray">
        <div class="tray-bar">
          <button type="button" class="tray-back" id="tray-back" hidden aria-label="Zpět"></button>
          <h3 id="tray-title">Přidat</h3>
        </div>
        <div class="tray-page is-on" data-page="home">
          <div class="tray-home" id="tray-home"></div>
        </div>
        <div class="tray-page" data-page="family">
          <div class="drawer-content grid-cards" id="char-list"></div>
        </div>
        <div class="tray-page" data-page="things">
          <p class="drawer-note" id="catalog-breadcrumb"></p>
          <div class="drawer-content grid-cards" id="items-list"></div>
        </div>
        <div class="tray-page" data-page="food">
          <p class="drawer-note">Přetáhni k puse = nakrmíš.</p>
          <div class="drawer-content grid-cards" id="food-list"></div>
        </div>
        <div class="tray-page" data-page="more">
          <div class="tray-home" id="tray-more"></div>
        </div>
        <div class="tray-page" data-page="map">
          <p class="drawer-note">Vyber destinaci — přiletíme letadlem.</p>
          <div class="world-map-grid" id="world-map-list"></div>
        </div>
        <div class="tray-page" data-page="wallpaper">
          <div class="wallpaper-grid" id="wallpaper-list"></div>
        </div>
        <div class="tray-page" data-page="updates">
          <div class="updates-body" id="updates-list"></div>
        </div>
      </aside>

      <div class="travel-overlay" id="travel-overlay" hidden></div>

      <aside class="drawer" id="room-picker-drawer">
        <div class="drawer-header">
          <h3>Kam jít?</h3>
          <button class="drawer-close" type="button">✕</button>
        </div>
        <nav class="picker-nav" id="room-nav"></nav>
      </aside>

      <button type="button" class="overlay-fab" id="btn-tools" aria-label="Přidat">+</button>
      <div class="toast" id="toast"></div>
      <input type="file" id="file-input" accept=".json,.zip" hidden/>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
